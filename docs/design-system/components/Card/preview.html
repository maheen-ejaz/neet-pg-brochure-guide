<!doctype html><meta charset="utf-8"><title>Card · Attio Mono</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@600&display=swap">
<style>
  body { margin: 0; background: var(--canvas); color: var(--body); font-family: var(--font-sans); padding: var(--space-6); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); max-width: 520px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
  .eyebrow { font: 500 12px/18px var(--font-sans); color: var(--muted); }
  .title { margin: 0; font: 600 18px/24px var(--font-display); letter-spacing: -0.015em; color: var(--ink); }
  .btn { font: 500 13px/16px var(--font-sans); border-radius: var(--radius-md); padding: 7px 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--line); font: 500 14px/20px var(--font-sans); }
  .rows li:first-child { border-top: 0; }
  .rows small { display: block; color: var(--muted); font-size: 12px; }
  .amt { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
<section class="card">
  <div class="head"><div><div class="eyebrow">Your money</div><h3 class="title">Fees &amp; security deposit</h3></div><button class="btn" type="button">Edit profile</button></div>
  <ul class="rows">
    <li><span>Registration<small>Non-refundable · rounds 1–3</small></span><span class="amt">₹3,000</span></li>
    <li><span>Government + private medical<small>Covers every college open to you</small></span><span class="amt">₹2,00,000</span></li>
    <li><span>Government colleges only<small>Cheaper, government seats only</small></span><span class="amt">₹30,000</span></li>
  </ul>
</section>
