<!doctype html><meta charset="utf-8"><title>Button · Attio Mono</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap">
<style>
  body { margin: 0; background: var(--surface); color: var(--body); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-6); }
  .cap { width: 100%; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .btn { font: 500 13px/16px var(--font-sans); letter-spacing: -0.005em; border-radius: var(--radius-md); padding: 9px 14px; cursor: pointer; border: 1px solid transparent; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-xs); }
  .accent { background: linear-gradient(135deg, var(--accent-from), var(--accent-to)); color: var(--on-accent); box-shadow: var(--shadow-xs); }
  .secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .secondary:hover { border-color: var(--muted); }
</style>
<div class="row">
  <div class="cap">Base (no accent)</div>
  <button class="btn primary" type="button">Start for free</button>
  <button class="btn secondary" type="button">Talk to sales</button>
  <div class="cap" style="margin-top:12px">With the accent layer</div>
  <button class="btn accent" type="button">Save &amp; see my results</button>
  <button class="btn secondary" type="button">Edit profile</button>
</div>
<script></script>
